# Sentinel configuration.
# Reprogram the whole system by editing the rules below in plain English.
# No retraining, no labelled data: the vision model reads these words each frame.

name: Sentinel

interval: 2.0          # seconds between frames (Gemini free tier likes >= ~2s)

# WHAT TO WATCH. Each rule is plain English. severity: warn (amber) or alarm (red + buzzer).
rules:
  - id: glasses
    watch: A person at the workbench is NOT wearing safety glasses.
    severity: warn
  - id: exit
    watch: The fire exit or walkway is blocked by a box, bag, or clutter.
    severity: alarm
  - id: hand
    watch: A bare hand is close to the spinning blade or hot tool.
    severity: alarm
  - id: spill
    watch: There is a liquid spill on the floor.
    severity: warn

# SENSE
camera:
  source: webcam       # webcam | picamera | image | demo
  index: 0
  width: 1024
  height: 768
  rotate: 0            # 0/90/180/270

# ANALYSE
vision:
  backend: gemini      # gemini | mock
  model: gemini-2.0-flash
  api_key_env: GEMINI_API_KEY

# DECIDE (debounce, so one flickery frame doesn't trip the alarm)
decide:
  min_confidence: 0.55
  trigger_streak: 2    # frames in a row before a rule fires
  clear_after: 3.0     # seconds quiet before it clears

# ACT
actuator:
  kind: serial         # mock | serial (Arduino UNO Q / any Arduino) | gpio (Raspberry Pi)
  # serial backend — the Arduino UNO Q path (see arduino/sentinel_actuator.ino):
  serial_port: /dev/ttyACM0   # UNO Q's MCU bridge, or an Arduino's USB port
  serial_baud: 115200
  # gpio backend — Raspberry Pi only (BCM pins):
  led_ok: 17
  led_warn: 27
  led_alarm: 22
  buzzer: 23
  servo: -1            # -1 = none; a pin makes a servo "close a barrier" on alarm

web_port: 8000
log_path: events.jsonl
