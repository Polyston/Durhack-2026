[project]
name = "sentinel"
version = "0.1.0"
description = "A plain-English-programmable safety camera: sense, analyse, decide, act."
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
# Install only what your setup needs.
gemini = ["google-generativeai>=0.8.0"]
webcam = ["opencv-python>=4.8.0"]
pi = ["gpiozero>=2.0", "picamera2>=0.3.0", "pillow>=10.0", "rpi-lgpio>=0.4"]
dev = ["pytest>=8.0"]

[project.scripts]
sentinel = "sentinel.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
